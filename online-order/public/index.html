<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f10" />
    <title>露坑 Camp &amp; Coffee</title>
    <link rel="preload" href="/brand/logo-ink.png" as="image" />
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="logo bar-logo" role="img" aria-label="露坑 logo"></div>
      <div class="bar-name"><b>露坑</b><small>Camp &amp; Coffee</small></div>
      <span id="table" class="bar-table" hidden></span>
    </header>
    <main class="page">
      <p id="message" class="message" role="status" hidden></p>
      <section id="menu-view">
        <div id="menu-home">
          <div class="welcome">
            <p id="greeting" class="greeting"></p>
            <h1 class="welcome-title">在露坑坐一下<span class="welcome-dot">。</span></h1>
            <nav id="shortcuts" class="shortcuts" aria-label="今天想喝什麼"></nav>
          </div>
          <section id="quiz" class="quiz" aria-labelledby="quiz-title" hidden>
            <div class="section-heading"><h2 id="quiz-title">不知道喝什麼？</h2><span>回答幾題，幫你挑。</span></div>
            <div id="quiz-body"></div>
          </section>
        </div>
        <nav id="tabs" class="tabs" aria-label="分類" hidden></nav>
        <p id="tab-note" class="tab-note" hidden></p>
        <div id="list" class="list"></div>
      </section>
      <section id="cart-view" hidden>
        <button id="back-menu" class="back-link" type="button">← 返回菜單</button>
        <h1 class="view-title">購物車</h1>
        <div id="cart-body"></div>
        <div id="challenge-widget" class="turnstile" aria-label="安全驗證"></div>
      </section>
      <section id="order-view" hidden>
        <p class="eyebrow">露坑 · 訂單</p>
        <h1 class="view-title">你的訂單</h1>
        <div id="order-body"></div>
      </section>
    </main>
    <p id="cart-feedback" class="cart-feedback" role="status" aria-live="polite"></p>
    <footer id="footer" class="footer" hidden></footer>
    <div id="sheet" class="sheet-backdrop" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <button id="sheet-close" class="sheet-close" type="button" aria-label="關閉">×</button>
        <div id="sheet-body"></div>
      </div>
    </div>
  </body>
</html>
